# Disposable local test databases. These public credentials are test-only.
services:
  test-a:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subscriptions_test
      POSTGRES_PASSWORD: local-test-admin
      PG_APP_PASSWORD: local-test-app
      PG_MIGRATOR_PASSWORD: local-test-migrator
    ports:
    - 127.0.0.1:15433:5432
    volumes:
    - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    tmpfs:
    - /var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d subscriptions_test
      interval: 2s
      timeout: 3s
      retries: 30
