apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: subscriptions
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - autoscaling.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: subscriptions-config
    files: [config.json]
generatorOptions:
  disableNameSuffixHash: true
# After editing config/keys, explicitly roll out pods. No hot topology reload.
images:
  - name: SUBSCRIPTIONS_API_IMAGE
    newName: registry.example.com/subscriptions
    newTag: REPLACE_WITH_RELEASE_TAG
