apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: subscriptions}
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: subscriptions, component: api}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: subscriptions}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: subscriptions}
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
